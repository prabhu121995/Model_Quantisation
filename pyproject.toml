[project]
name = "model-quantization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prabhu121995", email = "prabhurb95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "bitsandbytes>=0.50.2",
    "fastapi>=0.165.0",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
model-quantization = "model_quantization:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a real model and quantises it (run with `pytest -m slow`)"]
addopts = "-m 'not slow'"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
]
